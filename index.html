<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Subham E — choose your viewing profile to explore an operations and reporting career portfolio.">
<title>SUBHAM | Portfolio</title><link rel="stylesheet" href="styles.css">
<style>
body.intro-page{overflow:hidden;background:#050607}.intro-screen{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#1b1012 0%,#08090a 48%,#030404 100%);z-index:100;animation:screenFade 1s ease 3.25s forwards}.intro-logo{position:relative;display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,20px);animation:logoReveal 1.1s cubic-bezier(.2,.8,.2,1) .25s both}.intro-letter{font-size:clamp(92px,19vw,230px);font-weight:800;line-height:1;letter-spacing:-.12em;color:#e50914;text-shadow:0 0 35px rgba(229,9,20,.12);transform:scaleY(1.15);font-family:Arial,sans-serif}.intro-divider{height:clamp(80px,15vw,180px);width:3px;background:linear-gradient(transparent,#e50914 20%,#e50914 80%,transparent);transform:skew(-15deg);box-shadow:0 0 28px #e5091455}.intro-e{font-size:clamp(88px,18vw,215px);color:#f4f4f1;letter-spacing:-.12em;font-weight:800;line-height:1}.intro-wordmark{position:absolute;top:calc(100% + 22px);left:50%;transform:translateX(-50%);font:10px 'DM Mono',monospace;letter-spacing:clamp(3px,1vw,8px);white-space:nowrap;color:#bfc1c3;animation:wordReveal .8s ease 1s both}.intro-wordmark b{color:#e50914}.intro-scan{position:absolute;left:0;right:0;height:2px;top:50%;background:linear-gradient(90deg,transparent,#e50914,transparent);box-shadow:0 0 30px #e50914;animation:scan 1.1s ease-in-out .55s both;opacity:0}.intro-skip{position:absolute;right:28px;bottom:25px;color:#888;font:9px 'DM Mono',monospace;letter-spacing:1.5px}.intro-skip button{background:transparent;color:#eee;border:1px solid #555;padding:9px 14px;margin-left:12px;cursor:pointer;font:inherit;letter-spacing:1px}.intro-progress{position:absolute;bottom:0;left:0;height:3px;background:#e50914;width:0;animation:progress 3.25s linear forwards}
@keyframes logoReveal{0%{opacity:0;transform:scale(.35);filter:blur(18px)}55%{opacity:1;filter:blur(0);transform:scale(1.08)}100%{transform:scale(1)}}@keyframes wordReveal{from{opacity:0;letter-spacing:14px}to{opacity:1;letter-spacing:5px}}@keyframes scan{0%{top:15%;opacity:0}20%{opacity:1}100%{top:82%;opacity:0}}@keyframes progress{to{width:100%}}@keyframes screenFade{to{opacity:0;visibility:hidden;pointer-events:none}}@media(prefers-reduced-motion:reduce){.intro-screen,.intro-logo,.intro-wordmark,.intro-scan,.intro-progress{animation:none}.intro-screen{display:none}}
</style></head>
<body class="intro-page">
<div class="intro-screen" id="intro-screen" aria-label="Subham portfolio logo intro">
  <div class="intro-scan"></div>
  <div class="intro-logo"><span class="intro-letter">S</span><span class="intro-divider"></span><span class="intro-e">E</span><div class="intro-wordmark">SUBHAM <b>·</b> THE CAREER PORTFOLIO</div></div>
  <div class="intro-skip">A NEW STORY BEGINS <button id="skip-intro">SKIP INTRO ↗</button></div><div class="intro-progress"></div>
</div>
<script>
(function(){
 const finish=()=>{window.location.replace('profiles.html')};
 document.getElementById('skip-intro').addEventListener('click',finish);
 window.setTimeout(finish,3600);
})();
</script>
<noscript><p style="color:white;text-align:center">Enable JavaScript to continue to the portfolio.</p><a href="profiles.html" style="color:white">Continue</a></noscript>
</body></html>
