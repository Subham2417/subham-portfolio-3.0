<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Who's watching? | Subham</title><link rel="stylesheet" href="styles.css">
<style>
.profile-page{min-height:100vh;background:radial-gradient(ellipse at 50% 25%,#1b1d20,#090a0c 65%);display:flex;flex-direction:column}.profile-top{padding:28px 5.5vw}.profile-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 24px 90px}.profile-main h1{font-size:clamp(32px,5vw,55px);letter-spacing:-2px;font-weight:600;margin:0 0 12px;text-align:center}.profile-main>p{color:#8e9498;font-size:13px;margin:0 0 42px;text-align:center}.profile-grid{display:grid;grid-template-columns:repeat(4,minmax(130px,180px));gap:22px}.profile-choice{background:transparent;border:0;color:#ddd;cursor:pointer;text-align:center;padding:0;group:unset}.profile-avatar{width:clamp(112px,13vw,160px);aspect-ratio:1;border:2px solid transparent;border-radius:7px;display:grid;place-items:center;margin:0 auto 14px;transition:.2s;overflow:hidden;position:relative}.profile-avatar:after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.1);border-radius:5px}.profile-avatar svg{width:65%;height:65%}.profile-choice:hover .profile-avatar,.profile-choice:focus-visible .profile-avatar{border-color:#fff;transform:scale(1.04)}.profile-choice:hover .profile-name{color:white}.profile-name{font-size:14px;color:#aeb3b7;transition:.2s}.profile-sub{font:8px 'DM Mono',monospace;letter-spacing:1.2px;color:#6f767b;margin-top:5px}.avatar-hr{background:linear-gradient(145deg,#7e111a,#e50914)}.avatar-hm{background:linear-gradient(145deg,#123e42,#1b8b86)}.avatar-friend{background:linear-gradient(145deg,#253a74,#477ce8)}.avatar-family{background:linear-gradient(145deg,#725019,#d8a53d)}.profile-manage{margin-top:48px;border:1px solid #65696d;color:#a9aeb2;background:transparent;padding:10px 22px;font:10px 'DM Mono',monospace;letter-spacing:1.3px;cursor:pointer}.profile-footer{padding:20px;text-align:center;color:#555b60;font:8px 'DM Mono',monospace;letter-spacing:1.5px}.profile-intro{font:9px 'DM Mono',monospace;letter-spacing:2px;color:#e50914;margin-bottom:12px}.profile-choice.selected .profile-avatar{border-color:#e50914;box-shadow:0 0 24px #e5091426}.profile-tip{min-height:20px;color:#777e82;font-size:10px;margin-top:16px;text-align:center}
@media(max-width:700px){.profile-grid{grid-template-columns:repeat(2,minmax(120px,155px));gap:27px 20px}.profile-avatar{width:clamp(110px,30vw,145px)}.profile-main{padding-top:40px}.profile-main>p{margin-bottom:32px}.profile-manage{margin-top:34px}}
</style></head><body class="profile-page">
<header class="profile-top"><a class="brand" href="index.html"><span class="brand-mark">S</span><span>SUBHAM<span class="brand-dot">.</span></span></a></header>
<main class="profile-main"><div class="profile-intro">PERSONALIZE YOUR VIEWING EXPERIENCE</div><h1>Who's watching?</h1><p>Choose a profile to explore the portfolio from your point of view.</p>
<div class="profile-grid">
<button class="profile-choice" data-profile="hr" aria-label="View as HR"><span class="profile-avatar avatar-hr"><svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="34" r="18" fill="#fff"/><path d="M17 91c2-22 14-34 33-34s31 12 33 34" fill="#fff"/><path d="M42 60l8 12 8-12" stroke="#e50914" stroke-width="4"/></svg></span><span class="profile-name">HR</span><div class="profile-sub">RECRUITMENT VIEW</div></button>
<button class="profile-choice" data-profile="manager" aria-label="View as Hiring Manager"><span class="profile-avatar avatar-hm"><svg viewBox="0 0 100 100" fill="none"><rect x="18" y="15" width="64" height="70" rx="7" stroke="#fff" stroke-width="5"/><path d="M31 35h38M31 49h38M31 63h25" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="72" cy="72" r="13" fill="#c5f467"/><path d="M66 72l4 4 8-9" stroke="#183b36" stroke-width="3"/></svg></span><span class="profile-name">Hiring Manager</span><div class="profile-sub">IMPACT & EXPERIENCE</div></button>
<button class="profile-choice" data-profile="friend" aria-label="View as Friend"><span class="profile-avatar avatar-friend"><svg viewBox="0 0 100 100" fill="none"><circle cx="36" cy="35" r="16" fill="#fff"/><circle cx="68" cy="39" r="13" fill="#dce7ff"/><path d="M8 88c2-22 11-34 28-34s28 12 30 34" fill="#fff"/><path d="M51 88c2-17 8-27 18-27s20 10 22 27" fill="#dce7ff"/></svg></span><span class="profile-name">Friend</span><div class="profile-sub">THE HUMAN SIDE</div></button>
<button class="profile-choice" data-profile="family" aria-label="View as Family"><span class="profile-avatar avatar-family"><svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="31" r="15" fill="#fff"/><circle cx="25" cy="43" r="11" fill="#ffe9b9"/><circle cx="75" cy="43" r="11" fill="#ffe9b9"/><path d="M24 88c2-23 11-37 26-37s24 14 26 37" fill="#fff"/><path d="M2 87c1-17 7-27 21-27 6 0 11 2 14 7M98 87c-1-17-7-27-21-27-6 0-11 2-14 7" stroke="#fff" stroke-width="8" stroke-linecap="round"/></svg></span><span class="profile-name">Family</span><div class="profile-sub">THE JOURNEY SO FAR</div></button>
</div><div class="profile-tip" id="profile-tip" aria-live="polite">Select any profile to continue.</div><button class="profile-manage" id="manage-profiles">MANAGE PROFILES</button></main><footer class="profile-footer">SUBHAM E · A CAREER STORY, TOLD DIFFERENTLY</footer>
<script>
const descriptions={hr:"A recruiter-friendly overview: role fit, career timeline, core skills, and contact details.",manager:"A deeper look at operational ownership, metrics, process thinking, and problem-solving.",friend:"A lighter introduction to the person behind the work and the skills built along the way.",family:"A simple career journey, milestones, education, and the road ahead."};
document.querySelectorAll('.profile-choice').forEach(button=>button.addEventListener('click',()=>{const profile=button.dataset.profile;sessionStorage.setItem('subhamViewerProfile',profile);document.querySelectorAll('.profile-choice').forEach(b=>b.classList.remove('selected'));button.classList.add('selected');document.getElementById('profile-tip').textContent=descriptions[profile];setTimeout(()=>location.href='portfolio.html?view='+profile,260)}));
document.getElementById('manage-profiles').addEventListener('click',()=>{document.getElementById('profile-tip').textContent='Choose HR, Hiring Manager, Friend, or Family to continue. You can change profiles any time by returning here.'});
</script></body></html>
